    function questionCount(type, domain = S.domain) {
      return type === "player" ? 1 : domain === "uniqueness" ? 1 : Q.length;
    }
    function questionLabel(count) {
      return `${count} ${count === 1 ? "question" : "questions"}`;
    }
    function playerRecipientList() {
      return S.domain === "interfold"
        ? [...new Set(["nora", "tomas", "ingrid", ...FOUNDING_TEAM])].filter(
            (k) =>
              hasRole(k, "trainer"),
          )
        : uniquenessPeople.filter((k) => hasRole(k, "trainer"));
    }
    const lenaSeed = [
      ["maya", 3],
      ["kenji", 8],
      ["rosa", 17],
      ["idris", 32],
      ["hanne", 59],
      ["mateo", 130],
      ["amara", 310],
      ["sofia", 620],
      ["viktor", 1620],
      ["dara", 3200],
      ["yuki", 4980],
    ];
    function seededTime(minutes) {
      return new Date(Date.now() - minutes * 60000).toISOString();
    }
    function incomingRequests(p = S.persona, domain = S.domain) {
      let u = domain === "uniqueness",
        incoming = [];
      if (!u && (p === "nora" || p === "auryn"))
        for (const k of ["idris", "sofia", "leo"])
          incoming.push({
            from: k,
            type: "operator",
            time: D.times.ratings[1],
          });
      if (!u && p === "lena") {
        incoming.push({
          from: "leo",
          type: "operator",
          time: D.times.ratings[2],
        });
        lenaSeed
          .filter(
            ([from]) => !["maya", "hanne", "sofia", "viktor"].includes(from),
          )
          .forEach(([from, minutes]) =>
            incoming.push({
              from,
              type: "operator",
              time: seededTime(minutes),
            }),
          );
      } else if (!u && S.playerReady[p])
        incoming.push({
          from: "leo",
          type: "operator",
          time: D.times.ratings[2],
        });
      api.requests
        .list()
        .filter(
          (x) =>
            x.kind &&
            x.domain === domain &&
            x.to === p &&
            (!u || x.kind === "vouch"),
        )
        .forEach((x) =>
          incoming.push({
            from: x.from,
            type: x.kind === "vouch" ? "vouch" : "operator",
            time: x.time,
          }),
        );
      return incoming
        .filter(
          (request) =>
            (u || request.type !== "operator" || api.disclosure.get(request.from).nodes.length > 0) &&
            !(u ? [0] : [0, 1, 2]).every((i) =>
              api
                .getConnections(request.from, "inbound")
                .some(
                  (row) =>
                    row.id === p &&
                    row.evaluations.some(
                      (evaluation) =>
                        evaluation.domain === domain &&
                        evaluation.category === "subject" &&
                        (u || evaluation.question === Q[i]) &&
                        (!u ||
                          new Date(evaluation.modified) >=
                            new Date(request.time)),
                    ),
                ),
            ),
        )
        .sort((a, b) => new Date(b.time) - new Date(a.time));
    }
    function requestBreakdown(p = S.persona, domain = S.domain) {
      return deriveRequestBreakdown(p, domain);
    }
    function breakdownChips(p = S.persona, domain = S.domain) {
      let c = requestBreakdown(p, domain);
      return `<div class="breakdown">${requestStatuses
        .filter((status) => c[status])
        .map((status) =>
          StatusChip(
            c[status] + " " + status.toLowerCase() + (status === "Player ask" && c[status] !== 1 ? "s" : ""),
            ` data-request-status="${esc(status)}" data-request-count="${c[status]}"`,
          ),
        )
        .join("")}</div>`;
    }
    function nextIncoming(after) {
      return (
        deriveRequestQueue(S.persona, S.domain).incoming
          .concat(deriveRequestQueue(S.persona, S.domain).player, deriveRequestQueue(S.persona, S.domain).trainer)
          .find((x) => x.from !== after) || null
      );
    }
    function earlierAnswers(persona = S.persona, domain = S.domain) {
      return deriveHistory(persona, domain);
    }

    function earlierMark(a, domain) {
      let title = domain === "uniqueness"
        ? ({ subject: "Vouch", player: "Player", trainer: "Trainer", manager: "Manager" }[a.role] || "Vouch")
        : ["Key", "Self", "Disclosure"][a.question] || "Answer";
      return `<span class="${a.yes ? "yes" : "no"}">${title} · ${a.yes ? "Yes" : "No"} · confidence ${esc(a.conf || 1)}</span>`;
    }
    function earlierRow(row, domain) {
      let marks = row.answers
        .sort((a, b) => a.question - b.question)
        .map((a) => earlierMark(a, domain));
      if (row.player)
        marks.push(
          `<span class="${row.player.status === "Rated in" ? "yes" : "no"}">${row.player.status === "Rated in" ? "Rate in ✓" : "Not now"}${esc(row.player.conf || 1)}</span>`,
        );
      return DenseRow(
        esc(label(row.subject)),
        '<span class="chevron">›</span>',
        marks.join(" · ") + " · " + age(row.time),
        "past-answer",
        row.subject + (row.answers.some((a) => a.role === "manager") ? ":manager" : row.answers.some((a) => a.role === "trainer") ? ":trainer" : row.answers.some((a) => a.role === "player") ? ":player" : ""),
      );
    }
    function requests() {
      const { state: S, data: D } = screenModel();
      if (S.persona === "newcomer")
        return `<h1>Requests</h1>${card(action("Sign in", "sign-in", "primary"))}`;
      let p = S.persona,
        u = S.domain === "uniqueness",
        queue = deriveRequestQueue(p, S.domain),
        incoming = queue.incoming;
      let outgoing = S.outgoing
        .filter((x) => x.domain === S.domain && x.from === p)
        .map((x) => ({ ...x, request: "ask" }));
      outgoing.push(
        ...S.playerRequests
          .filter((x) => x.domain === S.domain && x.from === p && (!["trainer", "manager"].includes(x.role) || !hasRole(p, x.role)))
          .map((x) => ({ ...x, request: x.role || "player" })),
      );
      const finishedRoleAsks = ["trainer", "manager"].filter((role) =>
        hasRole(p, role) && S.playerRequests.some((x) => x.domain === S.domain && x.from === p && x.role === role));
      if (!u && S.teamAsked[p])
        outgoing.push({
          to: "team",
          time: S.teamAsked[p],
          request: "team",
          status: "waiting",
        });
      outgoing = outgoing.filter((x) => {
        if (x.request === "player") return ["waiting", "Sent", "Pending"].includes(x.status);
        if (["trainer", "manager"].includes(x.request)) return true;
        if (x.to.startsWith("link:") || x.to === "team") return true;
        if (u) return !uvouchers(p).some((v) => v.r === x.to);
        const answers = Q.flatMap((_, i) => votes(p, i)).filter((v) => v.r === x.to);
        return !answers.some((v) => !v.yes) && answers.length < Q.length;
      });
      outgoing.sort((a, b) => b.time.localeCompare(a.time));
      let pin = queue.player;
      let completed =
        S.justRated?.persona === p && S.justRated?.domain === S.domain
          ? S.justRated
          : null;
      let prior = earlierAnswers(p, S.domain);
      let incomingHtml = incoming
        .map((x) =>
          DenseRow(
            esc(label(x.from)),
            '<span class="request-row-tail">' +
              StatusChip(x.status) +
              '<span class="chevron">›</span></span>',
            (u ? "Asked for a vouch" : "Asked you") + " · " +
              questionLabel(questionCount(x.type)) + " · " + age(x.time) +
              (!u ? cells(x.from) : ""),
            "answer",
            x.from,
            "",
            x.status,
          ),
        )
        .join("");
      const playerRows = pin.map((x) => ({ ...x, completed: false }));
      if (completed && !playerRows.some((x) => x.from === completed.subject)) {
        const request = S.playerRequests.find((x) => x.domain === S.domain && x.from === completed.subject && x.to === p);
        playerRows.push({ from: completed.subject, time: request?.time || completed.time, completed: true });
      }
      playerRows.sort((a, b) => b.time.localeCompare(a.time));
      let playerHtml = playerRows.map((x) => {
        if (x.completed) {
          const record = S.answers.find((a) => a.domain === S.domain && a.subject === x.from && a.rater === p && a.role === "player");
          return `<div class="player-answer-unit">${DenseRow(esc(label(x.from)), StatusChip("Answered"), "Wants to be a player · " + age(x.time))}<div class="ask-question">Should this person be a player?</div>${AnswerControl("player", x.from, 0, record)}</div>`;
        }
        return `<div class="player-answer-unit" data-request-row-status="${esc(x.status)}">${DenseRow(esc(label(x.from)), "", "Wants to be a player · " + questionLabel(questionCount("player")) + " · " + age(x.time))}<div class="ask-question">Should this person be a player?</div>${AnswerControl("player", x.from, 0, null)}</div>`;
      }).join("");
      const sentKinds = [...new Set(outgoing.map((x) => x.request))];
      let sentHtml = sentKinds.map((kind) => {
        const asks = outgoing.filter((x) => x.request === kind);
        const answered = asks.map((x) => {
          if (kind === "ask" || kind === "team") {
            const answers = S.domain === "uniqueness" ? uvouchers(p).filter((v) => v.r === x.to) : Q.flatMap((_, i) => votes(p, i)).filter((v) => v.r === x.to);
            return answers.some((v) => !v.yes) ? "No" : answers.length >= (S.domain === "uniqueness" ? 1 : Q.length) ? "Yes" : "Waiting";
          }
          return ["waiting", "Sent", "Pending"].includes(x.status) ? "Waiting" : x.status === "Rated in" || x.status === "Yes" ? "Yes" : "No";
        });
        const title = ({ ask: u ? "Vouch ask" : "Node operator ask", team: "Node operator ask", player: "Player ask", trainer: "Trainer ask", manager: "Manager ask" })[kind] || "Ask";
        return `<section class="sent-kind"><h3>${title} · ${answered.filter((x) => x === "Yes").length} of ${asks.length} Yes</h3>${asks.map((x, i) => DenseRow(esc(x.to === "team" ? "Interfold team" : x.to.startsWith("link:") ? "Someone you sent a link to" : label(x.to)), StatusChip(answered[i]), `${title} · ${age(x.time)}${["trainer", "manager"].includes(kind) ? " · " + esc(label(x.to)) + " · " + answered[i] + (answered[i] === "Waiting" ? "" : " · " + esc(x.conf || 1)) : ""}`, x.to === "team" || x.to.startsWith("link:") ? "" : "detail", x.to)).join("")}</section>`;
      }).join("");
      let trainerHtml = [...queue.trainer].sort((a, b) => b.time.localeCompare(a.time)).map((x) => {
        const record = S.answers.find((a) => a.domain === S.domain && a.subject === x.from && a.rater === p && a.role === "trainer");
        return `<div class="player-answer-unit" data-request-row-status="${esc(x.status)}">${DenseRow(esc(label(x.from)), record ? StatusChip("Answered") : "", "Wants to be a trainer · " + age(x.time))}<div class="ask-question">Should this person be a trainer?</div>${AnswerControl("trainer", x.from, 0, record)}</div>`;
      }).join("");
      const requestSection = (title, body, role) => body ? `<section class="section request-section role-${role}"><h2>${title}</h2><div class="request-group">${body}</div></section>` : "";
      const questionHtml = incoming.filter((x) => x.type !== "manager").map((x) => DenseRow(esc(label(x.from)), '<span class="request-row-tail">' + StatusChip(x.status) + '<span class="chevron">›</span></span>', (u ? "Asked for a vouch" : "Asked you") + " · " + questionLabel(questionCount(x.type)) + " · " + age(x.time) + (!u ? cells(x.from) + uniquenessSubjectChip(x.from) : ""), "answer", x.from, "", x.status)).join("");
      const managerHtml = incoming.filter((x) => x.type === "manager").map((x) => DenseRow(esc(label(x.from)), StatusChip(x.status), "Wants to be a manager · " + age(x.time), "answer", x.from + ":manager", "", x.status)).join("");
      const ownedInvites = Object.entries(S.invites).filter(([, x]) => x.inviter === p);
      const inviteRows = !u ? ownedInvites.map(([token, x]) => DenseRow(x.claimedBy ? `${esc(x.name)} · ${Math.min(2, operatorAsked(x.claimedBy).length)} of 2 asked` : `Invite · ${esc(x.name)} · not opened yet`, "›", "", "invite-detail", token)).join("") : "";
      const invitesHtml = "";
      const deferredRow = (x, ignored = false) => `<div>${PersonRow(x.from, (x.type === "player" ? "Wants to be a player" : x.type === "trainer" ? "Rate as trainer" : u ? "Asked for a vouch" : "Asked you") + " · " + Ago(x.time), ignored
        ? `<button class="nav" data-action="unignore" data-subject="${esc(x.from)}">Un-ignore</button>`
        : '<span class="chevron">›</span>', ignored ? "" : "answer", x.from + (x.type === "player" ? ":player" : x.type === "trainer" ? ":trainer" : ""), ignored ? "" : "Later")}</div>`;
      const laterHtml = queue.later.length ? `<section class="section"><h2>Later</h2>${queue.later.map((x) => deferredRow(x)).join("")}</section>` : "";
      const ignoredHtml = queue.ignored.length ? `<details class="ignored-list"><summary>Ignored (${queue.ignored.length})</summary>${queue.ignored.map((x) => deferredRow(x, true)).join("")}</details>` : "";
      return `<h1>Requests</h1>${!u ? `<div class="enter-code">${InputField("arrival-code-input", "Enter a code", "6-character code", "", 'maxlength="6" autocomplete="off"')}${action("Open request", "redeem-code")}</div>` : ""}${!isPlayer() && !u && !FOUNDING_TEAM.includes(p) ? `<div class="quiet-line">${nav(p === "idris" ? "Review your operator status →" : "Get endorsed as a node operator →", p === "idris" ? "detail" : "endorse", p === "idris" ? p : "")} · ${nav("Ask to be a player →", "player-ask")}</div>` : ""}<section class="section"><h2>Waiting on you · ${incoming.length + pin.length + queue.trainer.length}</h2>${!incoming.length && !pin.length && !queue.trainer.length && !completed ? "<p>Nothing waiting on you.</p>" : ""}</section>${requestSection("Player asks", playerHtml, "player")}${requestSection("Trainer asks", trainerHtml, "trainer")}${requestSection("Manager asks", managerHtml, "manager")}${requestSection(u ? "Vouch requests" : "Node operator questions", questionHtml, u ? "vouch" : "operator")}<section class="section"><h2>Waiting on others · ${outgoing.length + (!u ? ownedInvites.length : 0)}</h2>${!u && canInvite(p) ? `<div class="quiet-line">${nav("Invite someone →", "invite")}</div>` : ""}${card((sentHtml + inviteRows) || "<p>Nothing waiting on others.</p>")}${nav("Ask someone →", "ask")}</section>${Disclosure("Answered · " + (prior.length + finishedRoleAsks.length), card(prior.map((x) => earlierRow(x, S.domain)).join("") + finishedRoleAsks.map((role) => DenseRow(role[0].toUpperCase() + role.slice(1) + " ask", StatusChip("Done"), "Done · you're a " + role)).join("") || "<p>No earlier answers.</p>"))}${invitesHtml}${laterHtml}${ignoredHtml}${StateFooter(queue.rows.length ? (incomingHtml.includes("Seated") ? "Seated: can hold threshold-council tickets." : "Answer when you’re ready.") : "You’re done here.")}`;
    }

    function playerAsk() {
      const { state: S, data: D } = screenModel();
      const role = nextAskRole() || "player";
      const recipients = (role === "player" ? playerRecipientList() : Object.keys(D.ids).filter((k) => (api.getVerifications(k, S.domain)?.categories?.manager?.level ?? api.getVerifications(k, "BrightID")?.categories?.manager?.level ?? 0) >= 1)).filter((k) => k !== S.persona);
      return `<div class="back">${nav("← Back", "back")}</div><h1>Get endorsed as a ${role}</h1><p>${role === "player" ? playerPath() : `Managers in ${S.domain === "uniqueness" ? "Uniqueness" : "Interfold"} answer this.`}</p>${card(recipients.map((k) => `${DenseRow(esc(label(k)), SendSlot(role, k))}`).join("") || "<p>No managers available.</p>")}`;
    }

    function setupNode() {
      const { state: S, data: D } = screenModel();
      return flowShell(
        `<div class="back">${nav("← Back", "back")}</div><h1>Set up your node</h1><p>Start a node you control.</p>`,
        action("My node is ready", "node-ready", "primary"),
      );
    }

    function declareNode() {
      const { state: S, data: D } = screenModel();
      return flowShell(
        `<div class="back">${nav("← Back", "back")}</div><h1>Declare your node</h1><p>Connect it to this identity.</p>`,
        action("Declare node", "declare-node", "primary"),
      );
    }

    function board() {
      const { state: S, data: D } = screenModel();
      if (S.domain === "uniqueness")
        return `<h1 class="board-title">Uniqueness board</h1>${tag("Levels for the assumed Interfold founders are illustrative.")}${card(BoardList(uniquenessPeople, (k) => DenseRow(`<span class="person-name">${esc(label(k))}</span>${VoteCell(uvouchers(k))}`, subjectStanding(k) === "Subject —" ? '<span class="subject-missing">Subject —</span>' : StatusChip(subjectStanding(k)), roles(k, 2, true), "detail", k)))}`;
      let groups = [
        ["Seated", []],
        ["Disputed", []],
        ["Pending", []],
      ];
      D.operators
        .concat(
          Object.keys(S.nodeDeclared)
            .filter(
              (k) => S.nodeDeclared[k] && !D.operators.some((a) => a[0] === k),
            )
            .map((k) => [k, 1, []]),
        )
        .forEach((a) => {
          let status = opStatus(a[0]);
          groups[
            status === "Seated" ? 0 : status === "Held back by a No" ? 1 : 2
          ][1].push(a[0]);
        });
      return `<h1>Interfold board</h1>${groups.map(([title, keys]) => `<section class="section"><div class="group-title ${title === "Seated" ? "good" : title === "Disputed" ? "bad" : "pending"}"><h2>${title}</h2><span class="group-count">${keys.length}</span></div>${card(`<div class="board-head"><span>Operator</span><span>Key</span><span>Self</span><span>Disclosure</span></div>${BoardList(keys, (k) => DenseRow(esc(label(k)) + uniquenessSubjectChip(k), Q.map((_, i) => VoteCell(votes(k, i))).join(""), StatusChip(opStatus(k)), "detail", k, "grid"))}`)}</section>`).join("")}<div class="board-legend"><span class="yes">●</span> Yes &nbsp; <span class="no">●</span> No &nbsp; ○ Missing answer<br>${nav("Open Network →", "network")}</div>`;
    }

    function operatorProfile(k, editable = false, collapsed = false) {
      const profile = api.disclosure.get(k);
      const content = `<div class="group-title">Nodes I run</div>${profile.nodes.length ? ownNodeRows(k) : "<p>None</p>"}<div class="group-title">Operators I share control with</div>${profile.controlRelationships.length ? profile.controlRelationships.map((id) => DenseRow(esc(label(id)), "", "Shares control with this operator")).join("") : "<p>None</p>"}${editable ? `<div class="profile-actions"><button class="nav" data-view="node-choice">${profile.nodes.length ? "Add another node →" : "Add a node →"}</button><button class="nav" data-view="edit-disclosure">Edit shared control →</button></div>` : ""}`;
      if (collapsed) {
        const nodeCount = profile.nodes.length;
        const sharedCount = profile.controlRelationships.length;
        return `<div class="answer-profile">${Disclosure(`${nodeCount} ${nodeCount === 1 ? "node" : "nodes"} · shares control with ${sharedCount ? `${sharedCount} ${sharedCount === 1 ? "operator" : "operators"}` : "no one"}`, content)}</div>`;
      }
      return card(`<h2>Operator disclosure profile</h2>${content}`);
    }
    function sharedControl() {
      return flowShell(`${flowBack()}<h1>Who controls your nodes' keys?</h1><p>Count anyone who holds a key, or who tells you how to use one.</p><div class="choice-group">${action("Just me", "shared-control-none")}${action("Someone else too", "shared-control-add")}</div>`, "", "", true);
    }
    function arrivalControl() {
      return flowShell(`${flowBack()}<h1>Who else controls your nodes?</h1>${S.arrivalControlNames.map((name, i) => `<div class="arrival-control-row"><span>${esc(name)}</span><button class="nav" data-action="arrival-control-remove" data-index="${i}" aria-label="Remove">Remove</button></div>`).join("")}${InputField("arrival-control-name", "Name", "Person's name", "", 'maxlength="80"')}<div class="choice-group">${action("Add another", "arrival-control-add")}${action("Done", "arrival-control-done")}</div>`, "", "", true);
    }
    function editDisclosure() {
      const relationships = api.disclosure.get(S.persona).controlRelationships;
      return `<div class="back">${nav("← Back", "back")}</div><h1>Operators I share control with</h1>${InputField("control-relationships", "Operators", "None", relationships.map(label).join(", "))}<p>Separate names with commas. None is a valid answer.</p>${action("Save disclosure", "save-disclosure", "primary")}${otherRoleLink(S.persona)}`;
    }
    function detail() {
      const { state: S, data: D } = screenModel();
      let [k] = String(S.detail || S.persona).split(":"),
        u = S.domain === "uniqueness";
      if (!D.ids[k])
        return `<h1>Detail</h1>${card("<p>No detail recorded.</p>")}`;
      if (u) {
        const rating = (role, question) => {
          const record = S.answers.find((a) => a.rater === S.persona && a.subject === k && a.domain === "uniqueness" && a.role === role);
          return card(`<div class="ask-question">${question}</div>${AnswerControl(role === "subject" ? "vouch" : role, k, 0, record, "Yes", "No", true)}`);
        };
        const ratings = k === S.persona ? "" : [
          canRate("subject") && rating("subject", "Is this one real, unique person?"),
          canRate("player") && hasRole(k, "subject") && rating("player", "Should this person be a player?"),
          canRate("trainer") && hasRole(k, "player") && rating("trainer", "Should this person be a trainer?"),
          canRate("manager") && hasRole(k, "trainer") && rating("manager", "Should this person be a manager?"),
        ].filter(Boolean).join("");
        return `<div class="back">${nav("← Back", "back")}</div><h1 class="detail-heading"><span class="detail-name">${esc(label(k))}</span>${StatusChip(uniquenessStatus(k))}</h1>${card(`<div class="role-chips">${roles(k, 4)}</div><div class="full-id">${esc(id(k))}</div>${["subject", "player", "trainer", "manager"].map((role) => readRow(role[0].toUpperCase() + role.slice(1), roleVotes(k, role))).join("")}`)}${ratings}`;
      }
      let a = op(k);
      if (!a)
        return `<div class="back">${nav("← Back", "back")}</div><h1>${esc(label(k))}</h1>${card(`<div class="full-id">${esc(id(k))}</div><div class="compact-status">Published owner · Interfold player</div>${uniquenessSubjectChip(k)}`)}`;
      return `<div class="back">${nav("← Back", "back")}</div><h1 class="detail-heading"><span class="detail-name">${esc(label(k))}</span>${StatusChip(opStatus(k))}</h1>${card(`<div class="full-id">${esc(id(k))}</div>${uniquenessSubjectChip(k)}${Q.map((q, i) => readRow(q + " · level " + level(k, i), votes(k, i), k, i)).join("")}`)}${operatorProfile(k, k === S.persona)}${opStatus(k) === "Seated" ? StateFooter("Seated: can hold threshold-council tickets.") : ""}`;
    }

    function network() {

    function editDistance(a, b) {
      let previous = Array.from({ length: b.length + 1 }, (_, i) => i);
      for (let i = 1; i <= a.length; i++) {
        let next = [i];
        for (let j = 1; j <= b.length; j++)
          next[j] = Math.min(
            next[j - 1] + 1,
            previous[j] + 1,
            previous[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1),
          );
        previous = next;
      }
      return previous[b.length];
    }
    function matchPeople(q) {
      let t = normalise(q.trim());

      for (const k of Object.keys(D.names)) {
        if (k === S.persona) continue;
        let name = canSeeName(k) ? normalise(D.names[k]) : "",
          first = normalise(id(k).slice(0, 8)),
          link = normalise("https://practice.aura.local/invite/" + k),
          score = Infinity;
        if (
          t.length >= 3 &&
          (first.startsWith(t) ||
            t.includes(first) ||
            (link.includes(t) && t.includes("/")))
        )
          score = -2;
        else if (name) {
          if (name.startsWith(t)) score = 0;
          else if (name.includes(t)) score = 1;
          else if (t.length >= 3) {
            let distance = editDistance(t, name);
            if (distance <= Math.max(1, Math.floor(t.length * 0.35)))
              score = 2 + distance;
          }
        }
        if (t.includes("/invite/" + k) || t.includes("/ask/" + k)) score = -2;
        if (score < Infinity) ranked.push({ k, score });
      }
      return ranked
        .sort((a, b) => a.score - b.score || a.k.localeCompare(b.k))
        .slice(0, 5)
        .map((x) => x.k);

          (async () => {
            try {
              if (sharedRoom) {
                const response = await fetch(`/api/claim?room=${encodeURIComponent(sharedRoom)}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token, id }) });
                const result = await response.json();
                if (response.status === 409) { S.activeInvite = null; S.inviteNotice = "This invite was already used"; S.view = "sign-in-flow"; render(); return; }
                if (!response.ok || result.claimedBy !== id) throw Error("claim failed");
              } else if (invite.claimedBy) { S.activeInvite = null; S.inviteNotice = "This invite was already used"; S.view = "sign-in-flow"; render(); return; }
              freshIdentity(name, id);
              S.invites[token].claimedBy = id;
              S.outgoing.push({ from: id, to: invite.inviter, domain: "interfold", kind: "endorsement", time: new Date().toISOString() });
              S.nameGrants.push({ viewer: invite.inviter, person: id });
              S.arrivalRole[id] = "operator"; S.activeInvite = null; S.inviteNotice = "";
              commitWorld(); go("node-address", null, false, "✓ Welcome, " + name);
            } catch (error) { b.disabled = false; b.textContent = "Create your passkey"; toast("Could not claim invite · try again"); }
          })();
          return;
        }
        freshIdentity(name);
        S.inviteNotice = "";
        go(S.flow === "player" ? "player-trainer" : S.domain === "uniqueness" ? "node-choice" : "role-choice", null, false, "✓ Welcome, " + label(S.persona));
        return;
      }

      if (["role-operator", "role-player", "role-trainer", "role-manager"].includes(a)) {
        const role = a.slice(5);
        if ((role === "trainer" && !hasRole(S.persona, "player")) || (role === "manager" && !hasRole(S.persona, "trainer"))) return;
        S.pendingArrivalRole = role;
        if (role === "player") S.flow = "player";
        go(role === "operator" ? "node-address" : role === "player" ? "player-trainer" : "advanced-role");
        return;
      }
      if (a === "confirm-arrival-role") {
        if (S.pendingArrivalRole === "trainer" || S.pendingArrivalRole === "manager") S.arrivalRole[S.persona] = S.pendingArrivalRole;
        S.pendingArrivalRole = null;
        go("home", null, true);
        return;
      }
      if (a === "arrival-together" || a === "arrival-send-link") {
        mintArrivalCode();
        if (sharedRoom) publishArrivalCode().then(ok => { if (ok) go(a === "arrival-together" ? "together" : "send-link"); });
        else go(a === "arrival-together" ? "together" : "send-link");
        return;
      }
      if (a === "arrival-find-player") { go("find-player"); return; }
      if (a === "arrival-ask-team") {
        if (!S.teamAsked[S.persona]) S.teamAsked[S.persona] = new Date().toISOString();
        if (operatorAsked(S.persona).length >= 2) go("home", null, true);
        else render();
        return;
      }
      if (a === "confirm-arrival-sent") {
        const to = "link:" + b.dataset.code;
        if (!S.outgoing.some((x) => x.from === S.persona && x.to === to && x.domain === "interfold"))
          S.outgoing.push({ from: S.persona, to, domain: "interfold", kind: "endorsement", time: new Date().toISOString() });
        if (operatorAsked(S.persona).length >= 2) go("home", null, true);
        else render();
        return;
      }
      if (a === "arrival-not-yet") { go("endorse"); return; }
      if (a === "copy-arrival") {
        b.textContent = "Copied ✓";
        copy(`Can you endorse me as a node operator in Interfold? ${arrivalLink()}`);
        clearTimeout(b.copyResetTimer);
        b.copyResetTimer = setTimeout(() => { if (b.isConnected) b.textContent = "Copy link"; }, 2000);
        return;
      }
      if (a === "discord-arrival") { copy(`Can you endorse me as a node operator in Interfold? ${arrivalLink()}`); return; }
      if (a === "redeem-code") {
        redeemArrivalCode(document.getElementById("arrival-code-input").value.trim().toUpperCase());
        return;
      }
      if (a === "node-yes" || a === "node-running") {
        go("node-address");
        return;
      }
      if (a === "node-no") {
        go("node-guide");
        return;
      }
      if (a === "more-node-add") { go("node-address"); return; }
      if (a === "more-node-done") { S.nodesComplete[S.persona] = true; go(sharedControlDone(S.persona) ? "home" : "shared-control"); return; }
      if (a === "check-node") {
        const input = document.getElementById("node-address");
        const address = input.value.trim();
        if (!address) {
          input.focus();
          toast("Paste your node’s public address");
          return;
        }
        if (S.pendingArrivalRole === "operator") {
          S.arrivalRole[S.persona] = "operator";
          S.pendingArrivalRole = null;
        }
        const checkingPersona = S.persona;
        const linked = api.linkAddress({ domain: S.domain, address });
        go("node-checking");
        linked.done.then(() => {
          S.nodeAnswered[checkingPersona] = new Date().toISOString();
          S.nodeDeclared[checkingPersona] = true;
          S.nodesComplete[checkingPersona] = false;
          commitWorld(checkingPersona);
          if (S.view === "node-checking" && S.persona === checkingPersona) {
            go(
              "more-nodes",
              null,
              false,
              "✓ Node added · Hetzner · Helsinki",
            );
            if (S.history.at(-1)?.view === "node-checking") S.history.pop();
          }
        });
        return;
      }

      if (a === "copy-endorsement") {
        copy(document.getElementById("ask-url").textContent);
        return;
      }
      if (a === "team-start") {
        go("requests");
        return;
      }
      if (a === "first-request") {
        go("answer", "leo");
        return;
      }
      if (a === "node-ready") {
        S.nodeReady[S.persona] = true;
        go("declare-node");
        return;
      }
      if (a === "declare-node") {
        api.linkAddress({
          domain: S.domain,
          address: S.nodeAddress[S.persona] || "practice node",
        });
        toast("Node declared in practice");
        go("home");
        return;
      }
      if (a === "open-player-ask") {
        go("player-ask");
        return;
      }
      if (a === "toggle-votes") {
        let list = b.closest(".compact-question").querySelector(".vote-list"),
          open = list.hidden;
        document
          .querySelectorAll(".vote-list:not([hidden])")
          .forEach((x) => (x.hidden = true));
        document
          .querySelectorAll('[data-action="toggle-votes"]')
          .forEach((x) => x.setAttribute("aria-expanded", "false"));
        list.hidden = !open;
        b.setAttribute("aria-expanded", String(open));
        return;
      }
      if (a === "new-account" || a === "sign-in") {
        S.flow = "operator";
        go("sign-in-flow");
        return;
      }
      if (a === "prove") {
        toast(
          "Passkey proof for " + label(S.persona) + " begins here in practice.",
        );
        return;
      }
      if (a === "create-invite") {
        if (!canInvite(S.persona)) return;
        const input = document.getElementById("invite-name"), name = input.value.trim();
        if (!name || name.length > 80) { input.focus(); toast("Enter their name (80 characters or fewer)"); return; }
        const token = Array.from(crypto.getRandomValues(new Uint8Array(16)), byte => byte.toString(16).padStart(2, "0")).join("");
        S.invites[token] = { inviter: S.persona, name, createdAt: Date.now() };
        S.creatingInvite = true;
        const inviteGeneration = generation;
        commitWorld(); render();
        (sharedRoom ? publishArrivalCode() : Promise.resolve(true)).then(ok => {
          S.creatingInvite = false;
          if (ok && (!sharedRoom || !inviteGeneration || inviteGeneration === generation) && S.invites[token]) { go("invite-detail", token); }
          else render();
        });
        return;
      }
      if (a === "copy-invite" || a === "share-invite") {
        const url = document.getElementById("invite-url").textContent;
        if (a === "share-invite" && navigator.share) navigator.share({ title: "Invite someone", url }).catch(() => {});
        else copy(url);
        return;
      }
      if (a === "copy-ask" || a === "share-ask") {
        copy(document.getElementById("ask-url").textContent);
        return;
      }
    });
    document.addEventListener("input", (e) => {
      if (location.hash === "#gallery") return;
      if (e.target.id === "person-search") {
        S.search = e.target.value;
        const results = document.getElementById("search-results"),
          m = matchPeople(S.search);
        results.innerHTML = searchResults(S.search);
      }
      if (e.target.id === "rate-search") {
        S.search = e.target.value;
        document.getElementById("rate-results").innerHTML = rateSomeoneRows(S.search);
      }
    });
    document.getElementById("persona").addEventListener("change", (e) => {
      if (sharedRoom && here.some(person => person.browserId !== browserId && person.persona === e.target.value)) {
        pendingPersona = e.target.value;
        document.getElementById("persona-in-use-message").textContent = `Someone else is using ${label(pendingPersona)}. Use it anyway?`;
        document.getElementById("persona-in-use-warning").hidden = false;
        e.target.value = S.persona;
        return;
      }
      dismissHomePromotionNotice();
      S.persona = e.target.value;
      S.flow = "operator";
      closeDrawer();
      go("home", null, true);
    });
    window.addEventListener("hashchange", () => {
      if (location.hash === "#gallery" || document.body.classList.contains("gallery-mode")) render();
      const code = new URLSearchParams(window.location.hash.slice(1)).get("ask")?.toUpperCase();
      if (!code) return;
      if (S.pendingArrivalCode === code && S.view === "sign-in-flow") return;
      if (S.persona !== "newcomer" && S.arrivalCodes[code]?.from !== S.persona && interfoldPlayer(S.persona)) redeemArrivalCode(code);
      else { S.pendingArrivalCode = code; go("sign-in-flow"); }
    });
    document.getElementById("domain").addEventListener("change", (e) => {
      dismissHomePromotionNotice();
      if (pendingPersona) {
        S.persona = pendingPersona;
        S.flow = "operator";
        pendingPersona = null;
        document.getElementById("persona-in-use-warning").hidden = true;
      }
      S.domain = e.target.value;
      closeDrawer();
      go("home", null, true);
    });
    if (sharedRoom) document.addEventListener("click", () => setTimeout(commitWorld, 0));
    render();
  })();
</script>
</body></html>
